[package]
name = "xtask"
version = "0.0.0" # never published; workspace-internal build tooling
edition = "2024"
rust-version = "1.88"
publish = false
authors = ["zai-rs"]

[dependencies]
# JSON parsing of the frozen OpenAPI/AsyncAPI snapshots.
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
# TOML for reading/writing SOURCES.toml, manual-constraints.toml, coverage.toml
# and forbidden-patterns.toml.
toml = "1.1.2"
# Hex/SHA-256 verification of the frozen contract blobs.
sha2 = "0.10.8"
# Stable, sorted serialization for reproducible manifest regeneration.
toml_edit = "0.22.27"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "deny"
