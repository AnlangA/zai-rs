name: Fuzz

# Bounded libFuzzer runs. PRs and pushes get a short regression check while the
# daily schedule retains a longer search budget for every target.
on:
  push:
    branches: [main, develop]
    paths:
      - ".github/workflows/fuzz.yml"
      - ".gitignore"
      - "Cargo.lock"
      - "Cargo.toml"
      - "fuzz/**"
      - "rust-toolchain.toml"
      - "scripts/bootstrap-tools.sh"
      - "src/**"
  pull_request:
    branches: [main, develop]
    paths:
      - ".github/workflows/fuzz.yml"
      - ".gitignore"
      - "Cargo.lock"
      - "Cargo.toml"
      - "fuzz/**"
      - "rust-toolchain.toml"
      - "scripts/bootstrap-tools.sh"
      - "src/**"
  schedule:
    # Daily; the minute is deliberately off the :00/:30 herd marks.
    - cron: "23 3 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Keep PR/push feedback short; scheduled and manually dispatched runs retain
  # the existing ten-minute per-target budget.
  FUZZ_MAX_TOTAL_TIME: ${{ (github.event_name == 'push' || github.event_name == 'pull_request') && '45' || '600' }}

permissions:
  contents: read

concurrency:
  # A scheduled long run must not cancel (or be cancelled by) a short push run
  # on the same branch.
  group: fuzz-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Fuzz smoke (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        target:
          - fuzz_sse_decoder
          - fuzz_error_handling
          - fuzz_url_segments
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install nightly Rust toolchain (libFuzzer needs -Zsanitizer)
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: nightly
          cache: true
          cache-workspaces: fuzz -> target

      # bootstrap-tools.sh compiles cargo-fuzz with the pinned 1.97.1 toolchain,
      # so install it alongside nightly first.
      - name: Install pinned cargo-fuzz
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          ./scripts/bootstrap-tools.sh cargo-fuzz

      - name: Run libFuzzer
        working-directory: fuzz
        run: >-
          cargo +nightly fuzz run "${{ matrix.target }}"
          "corpus/${{ matrix.target }}" --
          -max_total_time="${FUZZ_MAX_TOTAL_TIME}" -timeout=25

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-crashes-${{ matrix.target }}
          path: fuzz/artifacts/
          if-no-files-found: ignore
