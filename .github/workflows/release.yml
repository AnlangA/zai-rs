# Verify and publish an annotated tag whose version matches Cargo.toml. A tag
# workflow is successful only after attestation and crates.io publication;
# packaging-only rehearsal belongs in the reusable CI publish dry-run job.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: crates-io
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify annotated tag
        env:
          EXPECTED_SHA: ${{ github.sha }}
          TAG_REF: ${{ github.ref }}
        run: |
          tag_type="$(git cat-file -t "${TAG_REF}" 2>/dev/null || true)"
          if [ "${tag_type}" != "tag" ]; then
            echo "ERROR: ${TAG_REF} is not an annotated tag"
            exit 1
          fi

          tag_commit="$(git rev-parse --verify "${TAG_REF}^{commit}")"
          if [ "${tag_commit}" != "${EXPECTED_SHA}" ]; then
            echo "ERROR: ${TAG_REF} points to ${tag_commit}, expected ${EXPECTED_SHA}"
            exit 1
          fi

          checked_out_commit="$(git rev-parse --verify HEAD)"
          if [ "${checked_out_commit}" != "${EXPECTED_SHA}" ]; then
            echo "ERROR: checkout is ${checked_out_commit}, expected ${EXPECTED_SHA}"
            exit 1
          fi

      - name: Install release Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: "1.88.0"
          cache: true

      - name: Verify tag matches crate version
        id: crate
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          crate_version="$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "zai-rs") | .version')"
          if [ "${TAG_NAME}" != "v${crate_version}" ]; then
            echo "ERROR: tag ${TAG_NAME} does not match zai-rs v${crate_version}"
            exit 1
          fi
          echo "version=${crate_version}" >> "${GITHUB_OUTPUT}"

      - name: Install pinned SBOM generator
        run: ./scripts/bootstrap-tools.sh cargo-cyclonedx

      - name: Package crate
        run: cargo package --locked -p zai-rs --all-features

      - name: Verify package content policy
        env:
          CRATE_VERSION: ${{ steps.crate.outputs.version }}
        run: ./scripts/verify-package-contents.sh "target/package/zai-rs-${CRATE_VERSION}.crate"

      - name: Generate SBOM and checksums
        env:
          CRATE_VERSION: ${{ steps.crate.outputs.version }}
        run: |
          package_dir="target/package/zai-rs-${CRATE_VERSION}"
          sbom_name="zai-rs-${CRATE_VERSION}.cdx.json"
          cargo cyclonedx \
            --manifest-path "${package_dir}/Cargo.toml" \
            --all-features \
            --target all \
            --format json \
            --spec-version 1.5 \
            --override-filename "zai-rs-${CRATE_VERSION}.cdx"
          install -m 0644 "${package_dir}/${sbom_name}" "target/package/${sbom_name}"
          (
            cd target/package
            sha256sum "zai-rs-${CRATE_VERSION}.crate" "${sbom_name}" > SHA256SUMS
          )

      - name: Upload release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # Keep every attempt explicitly identifiable instead of depending on
          # GitHub's cleanup/same-name semantics when a failed job is rerun.
          name: zai-rs-${{ steps.crate.outputs.version }}-release-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: |
            target/package/zai-rs-${{ steps.crate.outputs.version }}.crate
            target/package/zai-rs-${{ steps.crate.outputs.version }}.cdx.json
            target/package/SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: target/package/zai-rs-${{ steps.crate.outputs.version }}.crate

      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: target/package/zai-rs-${{ steps.crate.outputs.version }}.crate
          sbom-path: target/package/zai-rs-${{ steps.crate.outputs.version }}.cdx.json

      - name: Authenticate to crates.io
        id: crates_io_auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates_io_auth.outputs.token }}
        run: cargo publish --locked -p zai-rs --all-features
