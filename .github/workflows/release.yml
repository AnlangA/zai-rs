# Verify and publish the v0.5.0 annotated tag. Set SKIP_PUBLISH=true in the
# release environment to run the quality and packaging checks without upload.
name: Release

on:
  push:
    tags:
      - "v0.5.0"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: crates-io
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.1.7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify annotated tag
        run: |
          git cat-file -t '${{ github.ref }}^{tag}' || {
            echo "ERROR: ${{ github.ref }} is not an annotated tag"
            exit 1
          }

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88.0"

      - name: Package dry-run
        run: cargo publish --dry-run --locked -p zai-rs --all-features

      - name: Publish (requires CRATES_IO_TOKEN)
        if: ${{ vars.SKIP_PUBLISH != 'true' }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: cargo publish --locked -p zai-rs --all-features --no-verify
