name: Benchmarks

on:
  schedule:
    # Weekly, away from the main CI and advisory refresh windows.
    - cron: "43 2 * * 0"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

concurrency:
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hot-paths:
    name: Criterion hot paths
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Install Rust 1.88
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: "1.88.0"
          cache: true

      - name: Measure public hot paths
        run: >-
          cargo bench --locked -p zai-rs
          --features realtime,toolkits
          --bench hot_paths

      # Reports are evidence for manual trend review. Deliberately do not gate
      # on wall-clock values from a shared GitHub-hosted runner.
      - name: Upload Criterion report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: criterion-hot-paths-${{ github.run_id }}
          path: target/criterion/
          if-no-files-found: error
          retention-days: 30
