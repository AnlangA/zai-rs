name: CI

on:
  workflow_call:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (fmt + clippy)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Install stable Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: stable
          components: rustfmt, clippy
          cache: true
          cache-workspaces: |
            . -> target
            fuzz -> target

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (all features + targets, deny warnings)
        run: cargo clippy --workspace --all-features --all-targets --locked -- -D warnings

      - name: Clippy (core crate, no optional features)
        run: cargo clippy -p zai-rs --no-default-features --all-targets --locked -- -D warnings

      - name: Check fuzz harness formatting and lints
        run: |
          cargo fmt --manifest-path fuzz/Cargo.toml -- --check
          cargo clippy --manifest-path fuzz/Cargo.toml --all-targets --locked -- -D warnings

      - name: Check shell and browser assets
        run: |
          bash -n scripts/bootstrap-tools.sh
          shellcheck scripts/bootstrap-tools.sh
          node --check examples/web_chat/static/js/app.js

  test:
    name: Test (stable & nightly)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        rust: [stable, nightly]

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: ${{ matrix.rust }}
          cache: true

      - name: cargo check (all features + targets)
        run: cargo check --workspace --all-features --all-targets --locked

      - name: cargo check (core crate, no optional features)
        run: cargo check -p zai-rs --no-default-features --all-targets --locked

      - name: cargo test (lib + integration)
        run: cargo test --workspace --all-features --tests --locked

      - name: cargo test (core crate, no optional features)
        run: cargo test -p zai-rs --no-default-features --tests --locked

      # Doc-tests are excluded by `--tests`; run them explicitly so runnable
      # doc examples (the `assert_eq!` in src/lib.rs, the client::error docs,
      # …) can't silently rot. Examples are covered by the build step below.
      - name: cargo test --doc (all features)
        run: cargo test --workspace --all-features --doc --locked

      # Compile-check every example with all features. Examples are not built by
      # `cargo test`, so without this step they can silently rot. They only
      # compile here — running them needs a live ZHIPU_API_KEY.
      - name: cargo build --examples (all features)
        run: cargo build --workspace --examples --all-features --locked

      - name: cargo doc (no-deps, treats doc warnings as errors)
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps --locked

  msrv:
    name: MSRV (edition 2024 → 1.88)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Install Rust 1.88
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: "1.88.0"
          cache: true

      - name: Verify build on MSRV
        # `--all-targets` (not just `--lib`) so example/test MSRV regressions are
        # caught too, not just the library.
        run: |
          cargo check --workspace --all-features --all-targets --locked
          cargo check -p zai-rs --no-default-features --all-targets --locked

      # `--all-features` can hide an accidental dependency on a sibling feature
      # through feature unification. Keep every public feature usable alone.
      - name: Verify each optional feature independently
        run: |
          for feature in mcp realtime toolkits rmcp-kits; do
            cargo check -p zai-rs --no-default-features \
              --features "${feature}" --all-targets --locked
          done

  guide:
    name: Guide (mdBook)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: "1.88.0"
          cache: true

      - name: Install pinned mdBook
        run: ./scripts/bootstrap-tools.sh mdbook

      - name: Build and test the guide
        run: |
          cargo build -p zai-rs --all-features --locked
          mdbook build
          mdbook test -L target/debug/deps

  link-check:
    name: Link check (lychee)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: "1.88.0"
          cache: true

      - name: Install pinned lychee
        run: ./scripts/bootstrap-tools.sh lychee

      # Lychee reads GITHUB_TOKEN to stay clear of github.com rate limits.
      - name: Check Markdown links
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: lychee --config lychee.toml --no-progress '*.md' 'docs/**/*.md' 'examples/**/*.md'

  coverage:
    name: Coverage (cargo-llvm-cov)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain with llvm-tools
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: "1.88.0"
          components: llvm-tools-preview
          cache: true

      - name: Install pinned cargo-llvm-cov
        run: ./scripts/bootstrap-tools.sh cargo-llvm-cov

      # `--tests` mirrors the test matrix of the `test` job; doc-tests are not
      # instrumented by llvm-cov. The report is uploaded as a build artifact
      # instead of an external service so no token has to be managed.
      - name: Generate lcov report
        run: cargo llvm-cov --workspace --all-features --tests --locked --lcov --output-path lcov.info

      - name: Upload coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lcov.info
          path: lcov.info
          if-no-files-found: error

  security:
    name: Security audit (${{ matrix.lockfile.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        lockfile:
          - name: workspace
            path: .
          - name: fuzz
            path: fuzz
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Install cargo-audit with locked dependencies
        run: cargo install cargo-audit --locked

      - name: Run cargo-audit
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: ${{ matrix.lockfile.path }}

  supply-chain-policy:
    name: Supply-chain policy (licenses + secrets)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: "1.88.0"
          cache: true

      - name: Install pinned policy tools
        run: |
          ./scripts/bootstrap-tools.sh cargo-deny
          ./scripts/bootstrap-tools.sh gitleaks

      - name: Check dependency licenses and sources
        run: cargo deny check

      # A custom Gitleaks config without inherited/default rules can report a
      # clean scan while checking nothing. Build (but never commit) a synthetic
      # token and require the scanner to detect it before trusting the history
      # result below.
      - name: Verify secret-detection rules are active
        run: |
          canary_suffix="$(printf 'zai-rs-gitleaks-canary' | sha256sum | cut -c1-36)"
          set +e
          printf 'github_token = ghp_%s\n' "${canary_suffix}" \
            | gitleaks stdin --redact --no-banner --config .gitleaks.toml \
              >/dev/null 2>&1
          scan_status="${PIPESTATUS[1]}"
          set -e
          if [ "${scan_status}" -ne 1 ]; then
            echo "ERROR: Gitleaks did not detect the runtime canary (exit ${scan_status})"
            exit 1
          fi

      - name: Scan repository history for secrets
        run: gitleaks git --redact --no-banner --config .gitleaks.toml

  publish-dry-run:
    name: Publish dry-run (packaging sanity)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Install stable Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: stable
          cache: true

      # Packages the crate and runs a verification build with all features,
      # catching metadata/exclude mistakes before a real `cargo publish`.
      - name: cargo publish --dry-run
        run: cargo publish --dry-run --locked -p zai-rs --all-features
