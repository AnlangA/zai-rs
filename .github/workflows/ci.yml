name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint (fmt + clippy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
          override: true

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (all features + targets, deny warnings)
        run: cargo clippy --all-features --all-targets -- -D warnings

  test:
    name: Test (stable & nightly)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust: [stable, nightly]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ matrix.rust }}
          override: true

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo check (all features + targets)
        run: cargo check --all-features --all-targets

      - name: cargo test (lib + integration)
        run: cargo test --all-features --tests

      - name: cargo doc (no-deps, treats doc warnings as errors)
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --all-features --no-deps

  msrv:
    name: MSRV (edition 2024 → 1.85)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust 1.85
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.85"
          override: true

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Verify build on MSRV
        # `--all-targets` (not just `--lib`) so example/test MSRV regressions are
        # caught too, not just the library.
        run: cargo check --all-features --all-targets

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Run cargo-audit
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  publish-dry-run:
    name: Publish dry-run (packaging sanity)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # Packages the crate and runs a verification build with all features,
      # catching metadata/exclude mistakes before a real `cargo publish`.
      - name: cargo publish --dry-run
        run: cargo publish --dry-run --all-features
