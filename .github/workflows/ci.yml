name: CI

on:
  workflow_call:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Refresh RustSec advisories weekly even when the repository is idle. All
    # non-security jobs skip scheduled events below.
    - cron: "17 4 * * 1"

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

concurrency:
  # Keep the weekly audit from cancelling an in-flight push build on `main`.
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    if: github.event_name != 'schedule'
    name: Lint (fmt + clippy)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install stable Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: stable
          components: rustfmt, clippy
          cache: true
          cache-workspaces: |
            . -> target
            fuzz -> target

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (all features + targets, deny warnings)
        run: cargo clippy --workspace --all-features --all-targets --locked -- -D warnings

      - name: Clippy (core crate, no optional features)
        run: cargo clippy -p zai-rs --no-default-features --all-targets --locked -- -D warnings

      - name: Check fuzz harness formatting and lints
        run: |
          cargo fmt --manifest-path fuzz/Cargo.toml -- --check
          cargo clippy --manifest-path fuzz/Cargo.toml --all-targets --locked -- -D warnings

      - name: Check shell and browser assets
        run: |
          bash -n scripts/bootstrap-tools.sh scripts/verify-package-contents.sh
          shellcheck scripts/bootstrap-tools.sh scripts/verify-package-contents.sh
          node --check examples/web_chat/static/js/app.js

  test:
    if: github.event_name != 'schedule'
    name: Test (stable & nightly)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        rust: [stable, nightly]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: ${{ matrix.rust }}
          cache: true

      - name: cargo check (all features + targets)
        run: cargo check --workspace --all-features --all-targets --locked

      - name: cargo check (core crate, no optional features)
        run: cargo check -p zai-rs --no-default-features --all-targets --locked

      - name: cargo test (lib + integration)
        run: cargo test --workspace --all-features --tests --locked

      - name: cargo test (core crate, no optional features)
        run: cargo test -p zai-rs --no-default-features --tests --locked

      # These harness-free targets contain deterministic resource assertions,
      # not only wall-clock measurements. Run their fast `cargo test` modes on
      # every PR/release quality gate; the weekly benchmark workflow remains
      # responsible for full Criterion sampling and trend artifacts.
      - name: cargo test (deterministic benchmark assertions, all features)
        if: matrix.rust == 'stable'
        run: cargo test -p zai-rs --all-features --benches --locked

      - name: cargo test (deterministic benchmark assertions, no optional features)
        if: matrix.rust == 'stable'
        run: cargo test -p zai-rs --no-default-features --benches --locked

      # Doc-tests are excluded by `--tests`; run them explicitly so runnable
      # doc examples (the `assert_eq!` in src/lib.rs, the client::error docs,
      # …) can't silently rot. Examples are covered by the build step below.
      - name: cargo test --doc (all features)
        run: cargo test --workspace --all-features --doc --locked

      # Compile-check every example with all features. Examples are not built by
      # `cargo test`, so without this step they can silently rot. They only
      # compile here — running them needs a live ZHIPU_API_KEY.
      - name: cargo build --examples (all features)
        run: cargo build --workspace --examples --all-features --locked

      - name: cargo doc (no-deps, treats doc warnings as errors)
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps --locked

  platform:
    if: github.event_name != 'schedule'
    name: Platform (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows 2025
            os: windows-2025
          - name: macOS 15
            os: macos-15

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install stable Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: stable
          cache: true

      - name: cargo check (all features + targets)
        run: cargo check -p zai-rs --all-features --all-targets --locked

      # Compile and run feature-gated platform code on the current stable
      # compiler. Linux owns the broader workspace matrix; these jobs prove
      # that the core crate's Windows/macOS cfg branches execute as well.
      - name: cargo test (core crate, all features)
        run: cargo test -p zai-rs --all-features --lib --tests --locked

      # The no-default suite uses only ephemeral loopback listeners. Its
      # symlink-specific cases are already gated with `cfg(unix)`, so the same
      # command is portable without duplicating Linux-only policy/tooling jobs.
      - name: cargo test (core crate, no optional features)
        run: cargo test -p zai-rs --no-default-features --tests --locked

      - name: Install Rust 1.88 for native platform MSRV check
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: "1.88.0"
          cache: false

      - name: cargo check (native platform MSRV, all features + targets)
        run: |
          cargo +1.88.0 check -p zai-rs --all-features --all-targets --locked
          cargo +1.88.0 check -p zai-rs --no-default-features --all-targets --locked

  msrv:
    if: github.event_name != 'schedule'
    name: MSRV (edition 2024 → 1.88)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust 1.88
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: "1.88.0"
          cache: true

      - name: Verify build on MSRV
        # Check the production library without dev-dependency feature
        # unification first, then compile every example/test/benchmark target.
        run: |
          cargo check --workspace --all-features --lib --locked
          cargo check -p zai-rs --no-default-features --lib --locked
          cargo check --workspace --all-features --all-targets --locked
          cargo check -p zai-rs --no-default-features --all-targets --locked

      # `--all-features` can hide an accidental dependency on a sibling feature
      # through feature unification. Keep every public feature usable alone.
      - name: Verify each optional feature independently
        run: |
          for feature in mcp realtime toolkits rmcp-kits; do
            cargo check -p zai-rs --no-default-features \
              --features "${feature}" --lib --locked
            cargo check -p zai-rs --no-default-features \
              --features "${feature}" --all-targets --locked
          done

      # Pairwise checks catch feature interactions that the individual-feature
      # and all-features builds can both hide through feature unification.
      - name: Verify every optional feature pair
        run: |
          for features in \
            mcp,realtime \
            mcp,toolkits \
            mcp,rmcp-kits \
            realtime,toolkits \
            realtime,rmcp-kits \
            toolkits,rmcp-kits
          do
            cargo check -p zai-rs --no-default-features \
              --features "${features}" --lib --locked
            cargo check -p zai-rs --no-default-features \
              --features "${features}" --all-targets --locked
          done

  guide:
    if: github.event_name != 'schedule'
    name: Guide (mdBook)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: "1.88.0"
          cache: true

      - name: Install pinned mdBook
        run: ./scripts/bootstrap-tools.sh mdbook

      - name: Build and test the guide
        run: |
          cargo build -p zai-rs --all-features --locked
          mdbook build
          mdbook test -L target/debug/deps

  link-check:
    if: github.event_name != 'schedule'
    name: Link check (lychee)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: "1.88.0"
          cache: true

      - name: Install pinned lychee
        run: ./scripts/bootstrap-tools.sh lychee

      # Lychee reads GITHUB_TOKEN to stay clear of github.com rate limits.
      - name: Check Markdown links
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: lychee --config lychee.toml --no-progress '*.md' 'docs/**/*.md' 'examples/**/*.md'

  coverage:
    if: github.event_name != 'schedule'
    name: Coverage (cargo-llvm-cov)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain with llvm-tools
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: "1.88.0"
          components: llvm-tools-preview
          cache: true

      - name: Install pinned cargo-llvm-cov
        run: ./scripts/bootstrap-tools.sh cargo-llvm-cov

      # `--tests` mirrors the test matrix of the `test` job; doc-tests are not
      # instrumented by llvm-cov. The report is uploaded as a build artifact
      # instead of an external service so no token has to be managed.
      # Baseline measured on 2026-07-24:
      # regions 83.14%, functions 76.11%, lines 82.92%.
      # These floors may only move upward. Keeping them explicit makes a
      # coverage loss fail before the report is uploaded.
      - name: Enforce coverage baseline and generate lcov report
        run: |
          cargo llvm-cov \
            --workspace \
            --all-features \
            --tests \
            --locked \
            --fail-under-regions 83.10 \
            --fail-under-functions 76.10 \
            --fail-under-lines 82.90 \
            --lcov \
            --output-path lcov.info

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lcov.info
          path: lcov.info
          if-no-files-found: error

  semver:
    if: github.event_name != 'schedule'
    name: Public API compatibility (cargo-semver-checks)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # cargo-semver-checks 0.49.0 requires Rust >=1.91. This toolchain is only
      # for the analyzer; the crate's actual MSRV remains covered separately.
      - name: Install analyzer Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: "1.97.1"
          cache: true

      - name: Install pinned cargo-semver-checks
        run: ./scripts/bootstrap-tools.sh cargo-semver-checks

      # Compare against the newest version tag reachable from this revision,
      # excluding a tag that points at HEAD itself (as happens in release CI).
      # Registry publication can lag a freshly prepared or tagged release, and
      # failed candidates remain part of the immutable tag history. Relying on
      # registry version ordering could therefore compare against the wrong
      # revision or turn this gate into a zero-check false positive.
      - name: Compare default and all-feature public APIs with the prior tag
        shell: bash
        run: |
          set -euo pipefail
          head_oid="$(git rev-parse HEAD)"
          baseline=""
          while IFS= read -r tag; do
            if [[ "$(git rev-list -n 1 "${tag}")" != "${head_oid}" ]]; then
              baseline="${tag}"
              break
            fi
          done < <(git tag --merged HEAD --list 'v[0-9]*' --sort=-v:refname)

          if [[ -z "${baseline}" ]]; then
            echo "No prior v* compatibility baseline is reachable from HEAD" >&2
            exit 1
          fi

          echo "Using semver baseline ${baseline}"
          cargo +1.97.1 semver-checks \
            --package zai-rs \
            --baseline-rev "${baseline}" \
            --release-type patch \
            --default-features \
            --color never
          cargo +1.97.1 semver-checks \
            --package zai-rs \
            --baseline-rev "${baseline}" \
            --release-type patch \
            --all-features \
            --color never

  security:
    name: Security audit (workspace + fuzz)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust 1.88
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: "1.88.0"
          cache: true

      - name: Install pinned cargo-audit
        run: ./scripts/bootstrap-tools.sh cargo-audit

      - name: Audit workspace and fuzz lockfiles
        run: |
          audit_status=0
          for lockfile in Cargo.lock fuzz/Cargo.lock; do
            cargo audit --file "${lockfile}" || audit_status=1
          done
          exit "${audit_status}"

  supply-chain-policy:
    if: github.event_name != 'schedule'
    name: Supply-chain policy (licenses + secrets)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: "1.88.0"
          cache: true

      - name: Install pinned policy tools
        run: |
          ./scripts/bootstrap-tools.sh cargo-deny
          ./scripts/bootstrap-tools.sh gitleaks

      - name: Check dependency licenses and sources
        run: |
          cargo deny check
          cargo deny --manifest-path fuzz/Cargo.toml check

      # A custom Gitleaks config without inherited/default rules can report a
      # clean scan while checking nothing. Build (but never commit) a synthetic
      # token and require the scanner to detect it before trusting the history
      # result below.
      - name: Verify secret-detection rules are active
        run: |
          canary_suffix="$(printf 'zai-rs-gitleaks-canary' | sha256sum | cut -c1-36)"
          set +e
          printf 'github_token = ghp_%s\n' "${canary_suffix}" \
            | gitleaks stdin --redact --no-banner --config .gitleaks.toml \
              >/dev/null 2>&1
          scan_status="${PIPESTATUS[1]}"
          set -e
          if [ "${scan_status}" -ne 1 ]; then
            echo "ERROR: Gitleaks did not detect the runtime canary (exit ${scan_status})"
            exit 1
          fi

      - name: Scan repository history for secrets
        run: gitleaks git --redact --no-banner --config .gitleaks.toml

  publish-dry-run:
    if: github.event_name != 'schedule'
    name: Publish dry-run (packaging sanity)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install stable Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: stable
          cache: true

      - name: Verify package content policy
        run: ./scripts/verify-package-contents.sh

      # Packages the crate and runs a verification build with all features,
      # catching metadata/exclude mistakes before a real `cargo publish`.
      - name: cargo publish --dry-run
        run: cargo publish --dry-run --locked -p zai-rs --all-features
