[package]
name = "web_chat"
version = "2.0.0"
edition = "2024"
rust-version = "1.88"
description = "Minimal browser chat example for zai-rs"
license = "MIT"
publish = false

[[bin]]
name = "web_chat"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.52.3", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
axum = "0.8.9"
tower-http = { version = "0.7.0", features = ["fs", "cors", "set-header", "trace"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
validator = { version = "0.21.0", features = ["derive"] }
thiserror = "2.0.18"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.23.3", features = ["v4"] }
chrono = "0.4.45"
dashmap = "6.2.1"
zai-rs = { path = "../.." }
futures-util = "0.3.32"
