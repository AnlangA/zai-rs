[package]
name = "web_chat"
version = "2.0.0"
edition = "2021"
authors = ["AI Assistant <ai@example.com>"]
description = "Modern AI Chat Web Application with perfect markdown rendering and industry-leading UX"
license = "MIT"

[[bin]]
name = "web_chat"
path = "src/main.rs"

[dependencies]
# Core async runtime
tokio = { version = "1.52.3", features = ["full"] }

# Web framework
axum = "0.8.9"
tower = "0.5.3"
tower-http = { version = "0.7.0", features = ["fs", "cors", "trace"] }

# Serialization
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"

# Validation
validator = { version = "0.20.0", features = ["derive"] }

# Error handling
thiserror = "2.0.18"
anyhow = "1.0.102"

# Logging and tracing
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# UUID generation
uuid = { version = "1.23.3", features = ["v4", "serde"] }

# Date/time handling
chrono = { version = "0.4.45", features = ["serde"] }

# Concurrent data structures
dashmap = "6.2.1"

# HTTP client (only reqwest::Response / reqwest::Error types are referenced)
reqwest = { version = "0.13", features = ["json"] }

# Main zai-rs dependency
zai-rs = { path = "../.." }

# Futures for streaming
futures = "0.3.32"

# Static file MIME type detection
mime_guess = "2.0.5"

[dev-dependencies]
tokio-test = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
debug = true
