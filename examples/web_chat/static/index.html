<!doctype html>
<html lang="en" data-theme="light">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="A small browser chat example powered by zai-rs">
    <title>zai-rs web chat</title>
    <link rel="stylesheet" href="/static/css/main.css">
    <script type="module" src="/static/js/app.js"></script>
</head>
<body>
    <div class="app-shell">
        <header class="app-header">
            <div>
                <p class="eyebrow">zai-rs example</p>
                <h1>Web chat</h1>
            </div>
            <div class="header-actions">
                <span class="status" id="connectionStatus" role="status">
                    <span class="status-dot" aria-hidden="true"></span>
                    <span id="connectionText">Checking server…</span>
                </span>
                <button class="secondary-button" id="themeButton" type="button">
                    Dark theme
                </button>
                <button class="secondary-button" id="newChatButton" type="button">
                    New chat
                </button>
            </div>
        </header>

        <main class="chat-panel">
            <section class="messages" id="messages" aria-live="polite" aria-label="Conversation">
                <div class="welcome" id="welcome">
                    <h2>Start a conversation</h2>
                    <p>This example keeps a bounded conversation history in memory and sends it through a shared <code>ZaiClient</code>.</p>
                </div>
            </section>

            <form class="composer" id="chatForm">
                <label class="sr-only" for="messageInput">Message</label>
                <textarea
                    id="messageInput"
                    maxlength="10000"
                    rows="2"
                    placeholder="Type a message…"
                    required
                ></textarea>

                <div class="options">
                    <label class="check-option">
                        <input id="thinkInput" type="checkbox">
                        Thinking mode
                    </label>
                    <label>
                        Temperature
                        <input id="temperatureInput" type="range" min="0" max="1" step="0.1" value="0.7">
                        <output id="temperatureOutput" for="temperatureInput">0.7</output>
                    </label>
                    <label>
                        Max tokens
                        <input id="maxTokensInput" type="range" min="128" max="4096" step="128" value="2048">
                        <output id="maxTokensOutput" for="maxTokensInput">2048</output>
                    </label>
                    <span class="character-count" id="characterCount">0 / 10000</span>
                </div>

                <div class="composer-actions">
                    <span class="keyboard-hint">Enter to send · Shift+Enter for a new line</span>
                    <button class="primary-button" id="sendButton" type="submit" disabled>Send</button>
                </div>
            </form>
        </main>
    </div>
</body>
</html>
