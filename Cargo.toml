# ---------------------------------------------------------------------------
# Workspace definition.
#
# resolver = 3 is the Rust 2024 edition default. Members are the root `zai-rs`
# package and the bundled example projects; the fuzz workspace remains a fully
# separate nested workspace.
# ---------------------------------------------------------------------------
[workspace]
resolver = "3"
members = [
    "examples/web_chat",
    "examples/mcp/client",
    "examples/mcp/servers",
    "examples/mcp/list_remote_mcp_tools",
]
exclude = [
    "fuzz",
]

[package]
name = "zai-rs"
version = "0.5.0"
edition = "2024"
rust-version = "1.88"
authors = ["anlang <2682525840@qq.com>"]
description = "一个 Rust SDK, 用于调用 智谱AI API"
documentation = "https://docs.rs/zai-rs"
repository = "https://github.com/AnlangA/zai-rs"
homepage = "https://github.com/AnlangA/zai-rs"
license = "MIT"
readme = "README.md"
keywords = ["zhipu", "glm", "ai", "llm", "bigmodel"]
categories = ["api-bindings", "asynchronous"]

# Keep published artifacts lean: exclude example build dirs, the local example
# media/fixtures (`data/`), and caches so they never enter a crates.io tarball.
exclude = [
    "/target",
    "/data",
    "examples/*/target",
    "examples/*/*/target",
    ".github",
    ".zcode",
    ".claude",
    "/out",
]

[package.metadata.docs.rs]
# Build the docs with every feature so the `realtime`, `tool-validation`, and
# `rmcp-kits` surfaces render on docs.rs (without this, docs.rs documents only
# the default feature set).
all-features = true
# Pairs with `#![cfg_attr(docsrs, feature(doc_cfg))]` in src/lib.rs so
# feature-gated items are badged in the rendered documentation.
rustdoc-args = ["--cfg", "docsrs"]


[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "time", "fs", "sync"] }
jsonschema = { version = "0.46.5", optional = true, default-features = false }
validator = { version = "0.20.0", features = ["derive"] }
url = "2.5.8"
reqwest = { version = "0.13.4", features = ["json", "multipart", "stream", "gzip"] }
# secrecy wraps the API key so it is never exposed via Debug/Display; the only
# place the plaintext is read is Authorization-header construction (P02.1).
secrecy = "0.10.3"

fastrand = "2.4.1"

regex = "1.12.4"

tracing = "0.1.44"

base64 = "0.22.1"
chrono = "0.4.45"
async-trait = "0.1.89"
thiserror = "2.0.18"
# Use `futures-util` (not the `futures` umbrella): the crate only needs the
# `Stream`/`StreamExt`/`SinkExt`/`join_all`/`FuturesUnordered` surface, never
# `futures-executor`. The umbrella would otherwise compile a thread-pool runtime
# the SDK never touches. `sink` is enabled for `SinkExt` (realtime transport).
futures-util = { version = "0.3.32", features = ["sink"] }
dashmap = "6.2.1"
rmcp = { version = "2.2.0", features = [
    "client",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
], optional = true }
# Only used to mint realtime event ids (`evt_<uuid>`); gated under `realtime`
# so the default chat/embeddings build doesn't pull it in. The `serde` feature
# is intentionally NOT enabled — no `Uuid` field is (de)serialized anywhere.
uuid = { version = "1.23.3", features = ["v4"], optional = true }

# Realtime (WebSocket) API dependencies.
# rustls keeps the SDK free of a system OpenSSL dependency.
tokio-tungstenite = { version = "0.29", features = ["connect", "rustls-tls-native-roots"], optional = true }
# JWT signing for the realtime client-auth handshake (HS256).
hmac = { version = "0.13.0", optional = true }
# sha2 is a CORE normal dependency (P03.12): the Transport uses it for response
# hashing/redaction and AtomicDownloadSink integrity. It is no longer feature-
# gated — the realtime JWT path simply reuses it.
sha2 = "0.11.0"
# tokio-util provides `io` for streaming multipart/download (P03.12).
tokio-util = { version = "0.7.18", default-features = false, features = ["io"] }
# `BroadcastStream` adapts tokio broadcast channels into `Stream`s for the
# realtime event/audio fan-out.
tokio-stream = { version = "0.1.18", features = ["sync"], optional = true }
# Unconditional: `bytes::Bytes` is used by the default HTTP send/parse path
# (not just the realtime transport/audio paths), so it can't be feature-gated.
bytes = "1.11.1"
http = { version = "1.4.2", optional = true }

[lints.rust]
# The SDK is unsafe-free; enforce that invariant at compile time (and make it
# self-documenting) rather than relying on review alone.
unsafe_code = "deny"

[lints.clippy]
# Mirror the CI gate (`cargo clippy --all-features --all-targets -- -D warnings`)
# locally: the same correctness/style lints fire AND fail the build in IDEs and
# plain `cargo clippy`, so a regression can't pass locally and only surface in
# CI. NOTE: `pedantic` is intentionally NOT enabled — the crate is only verified
# clean against the default group, and pedantic would surface dozens of new lints.
all = "deny"

[features]
default = []
# RMCP protocol bridge — builds on the toolkits framework to call remote MCP
# servers (plan P09.1). Enables `zai_rs::toolkits::rmcp_kits`.
rmcp-kits = ["dep:rmcp", "toolkits"]
# Unified user-facing MCP API. It does not pull in the lower-level toolkits
# framework; `rmcp-kits` remains available separately for custom MCP bridges.
mcp = ["dep:rmcp"]
# WebSocket realtime (GLM-Realtime) client. Off by default — most users only
# need the HTTP chat/embeddings surface. Pulls in tokio-tungstenite, the JWT
# crypto stack (hmac/sha2), tokio-stream, and `tokio/net`.
realtime = [
    "dep:tokio-tungstenite",
    "dep:hmac",
    "dep:tokio-stream",
    "dep:http",
    "dep:uuid",
    "tokio/net",
]
# Core tool-execution framework: dynamic tool registration, schema validation,
# and effect-aware execution (plan P09.1). Enables `zai_rs::toolkits`.
toolkits = ["dep:jsonschema"]
# Runtime validation of tool-call arguments against their JSON Schema. Off by
# default — disabling it drops the heavy `jsonschema` dependency (and its
# transitive `reqwest`/`fraction`/`fancy-regex`/... tree) for users who don't
# need argument validation at execution time.
# P09.1: this is a compatibility alias for `toolkits`, removed in 0.6.
tool-validation = ["toolkits"]

[[example]]
name = "realtime_audio"
required-features = ["realtime"]

[[example]]
name = "mcp"
required-features = ["mcp"]

[[example]]
name = "mcp_web_search"
required-features = ["mcp"]

[[example]]
name = "mcp_web_reader"
required-features = ["mcp"]

[[example]]
name = "mcp_zread"
required-features = ["mcp"]

[[example]]
name = "mcp_vision"
required-features = ["mcp"]

[dev-dependencies]
toml = "1.1.2"
hyper = { version = "1.10.1", features = ["full"] }
hyper-util = { version = "0.1.20", features = ["full"] }
http-body-util = "0.1.3"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
# tempfile is used by tests that previously read real media from `data/`; it
# lets them generate minimal PNG/WAV/text fixtures in a temp dir instead (P01.6).
tempfile = "3.27.0"
# Dev-only tokio `net` feature for the 127.0.0.1:0 TestServer (P02.13);
# `test-util` for paused-time backoff/deadline tests (P03.13).
tokio = { version = "1.52.3", features = ["net", "test-util"] }
# Property-based testing for contract invariant verification (P11.5).
proptest = "1.11.0"
