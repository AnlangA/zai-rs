[package]
name = "zai-rs"
version = "0.2.1"
edition = "2024"
rust-version = "1.85"
authors = ["anlang <2682525840@qq.com>"]
description = "一个 Rust SDK, 用于调用 智谱AI API"
documentation = "https://docs.rs/zai-rs"
repository = "https://github.com/AnlangA/zai-rs"
homepage = "https://github.com/AnlangA/zai-rs"
license = "MIT"
readme = "README.md"
keywords = ["zhipu", "glm", "ai", "llm", "bigmodel"]
categories = ["api-bindings", "asynchronous"]

# Keep published artifacts lean: exclude example build dirs, the local example
# media/fixtures (`data/`), and caches so they never enter a crates.io tarball.
exclude = [
    "/target",
    "/data",
    "examples/*/target",
    "examples/*/*/target",
    ".github",
    ".zcode",
    ".claude",
    "/out",
]

[package.metadata.docs.rs]
# Build the docs with every feature so the `realtime`, `tool-validation`, and
# `rmcp-kits` surfaces render on docs.rs (without this, docs.rs documents only
# the default feature set).
all-features = true
# Pairs with `#![cfg_attr(docsrs, feature(doc_cfg))]` in src/lib.rs so
# feature-gated items are badged in the rendered documentation.
rustdoc-args = ["--cfg", "docsrs"]


[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["full"] }
jsonschema = "0.46.5"
validator = { version = "0.20.0", features = ["derive"] }
url = "2.5.8"
reqwest = { version = "0.13.4", features = ["json", "multipart", "stream", "gzip"] }

fastrand = "2.4.1"

regex = "1.12.4"

tracing = "0.1.44"

base64 = "0.22.1"
chrono = "0.4.45"
async-trait = "0.1.89"
thiserror = "2.0.18"
futures = "0.3.32"
dashmap = "6.2.1"
parking_lot = "0.12.5"
rmcp = { version = "1.7.0", features = ["client"], optional = true }
axum = { version = "0.8.9", optional = true }
tower = { version = "0.5.3", optional = true }
tower-http = { version = "0.7.0", features = ["fs", "cors"], optional = true }
uuid = { version = "1.23.3", features = ["v4", "serde"] }

# Realtime (WebSocket) API dependencies.
# rustls keeps the SDK free of a system OpenSSL dependency.
tokio-tungstenite = { version = "0.29", features = ["connect", "rustls-tls-native-roots"] }
# JWT signing for the realtime client-auth handshake (HS256).
hmac = "0.13.0"
sha2 = "0.11.0"
# `BroadcastStream` adapts tokio broadcast channels into `Stream`s for the
# realtime event/audio fan-out.
tokio-stream = { version = "0.1.18", features = ["sync"] }
# Promoted from dev-dependencies — needed by the realtime transport/audio paths.
bytes = "1.11.1"
http = "1.4.2"

[features]
default = []
rmcp-kits = ["dep:rmcp"]
web-example = ["dep:axum", "dep:tower", "dep:tower-http"]

[dev-dependencies]
toml = "1.1.2"
hyper = { version = "1.10.1", features = ["full"] }
hyper-util = { version = "0.1.20", features = ["full"] }
http-body-util = "0.1.3"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
