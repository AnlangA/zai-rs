# ---------------------------------------------------------------------------
# Workspace definition.
#
# resolver = 3 is the Rust 2024 edition default. Members are the root `zai-rs`
# package and the bundled example projects; the fuzz workspace remains a fully
# separate nested workspace.
# ---------------------------------------------------------------------------
[workspace]
resolver = "3"
members = [
    "examples/web_chat",
    "examples/mcp/client",
    "examples/mcp/servers",
    "examples/mcp/list_remote_mcp_tools",
]
exclude = [
    "fuzz",
]

[package]
name = "zai-rs"
version = "0.6.0"
edition = "2024"
rust-version = "1.88"
authors = ["anlang <2682525840@qq.com>"]
description = "Type-safe async Rust SDK for Zhipu AI (BigModel) APIs"
documentation = "https://docs.rs/zai-rs"
repository = "https://github.com/AnlangA/zai-rs"
homepage = "https://github.com/AnlangA/zai-rs"
license = "MIT"
readme = "README.md"
keywords = ["zhipu", "glm", "ai", "llm", "bigmodel"]
categories = ["api-bindings", "asynchronous"]

# Keep the crates.io artifact focused on library sources, user documentation,
# examples, and test contracts. Repository-only tooling and upstream snapshots
# are not needed by downstream builds.
exclude = [
    "/data",
    "/fuzz",
    "/scripts",
    "/spec/upstream",
    "/.cargo",
    "/.github",
    "/.clippy.toml",
    "/.gitignore",
    "/.gitleaks.toml",
    "/book.toml",
    "/deny.toml",
    "/rust-toolchain.toml",
    "/rustfmt.toml",
]

[package.metadata.docs.rs]
# Build the docs with every feature so the `realtime`, `toolkits`, and
# `rmcp-kits` surfaces render on docs.rs (without this, docs.rs documents only
# the default feature set).
all-features = true
# Pairs with `#![cfg_attr(docsrs, feature(doc_cfg))]` in src/lib.rs so
# feature-gated items are badged in the rendered documentation.
rustdoc-args = ["--cfg", "docsrs"]


[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["rt", "macros", "time", "fs", "sync"] }
jsonschema = { version = "0.46.5", optional = true, default-features = false }
validator = { version = "0.20.0", features = ["derive"] }
url = "2.5.8"
# Select transport behavior explicitly: the SDK needs rustls, HTTP/2, proxy
# discovery, gzip, multipart, and streaming, but performs its own JSON decode.
reqwest = { version = "0.13.4", default-features = false, features = [
    "gzip",
    "http2",
    "multipart",
    "rustls",
    "stream",
    "system-proxy",
] }
# secrecy keeps API keys out of Debug/Display output. Plaintext access is
# limited to HTTP authentication and SDK-managed MCP child-process setup.
secrecy = "0.10.3"

fastrand = "2.4.1"

regex = "1.12.4"

tracing = "0.1.44"

base64 = "0.22.1"
# `clock` provides UTC timestamps; timezone-database and WebAssembly defaults
# are unnecessary for the SDK's fixed-offset wire types.
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
async-trait = "0.1.89"
thiserror = "2.0.18"
# Use `futures-util` (not the `futures` umbrella): the crate only needs the
# `Stream`/`StreamExt`/`SinkExt`/`join_all`/`FuturesUnordered` surface, never
# `futures-executor`. The umbrella would otherwise compile a thread-pool runtime
# the SDK never touches. `sink` is enabled for `SinkExt` (realtime transport).
futures-util = { version = "0.3.32", features = ["sink"] }
dashmap = "6.2.1"
rmcp = { version = "2.2.0", default-features = false, features = [
    "client",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
], optional = true }
# Only used to mint realtime event ids (`evt_<uuid>`); gated under `realtime`
# so the default chat/embeddings build doesn't pull it in. The `serde` feature
# is intentionally NOT enabled — no `Uuid` field is (de)serialized anywhere.
uuid = { version = "1.23.3", features = ["v4"], optional = true }

# Realtime (WebSocket) API dependencies.
# rustls keeps the SDK free of a system OpenSSL dependency.
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "rustls-tls-native-roots"], optional = true }
# JWT signing for the realtime client-auth handshake (HS256).
hmac = { version = "0.13.0", optional = true }
# SHA-256 is only needed for realtime JWT signing.
sha2 = { version = "0.11.0", optional = true }
# Adapts replayable async file handles into bounded multipart body streams.
tokio-util = { version = "0.7.18", default-features = false, features = ["io"] }
# Unconditional: `bytes::Bytes` is used by the default HTTP send/parse path
# (not just the realtime transport/audio paths), so it can't be feature-gated.
bytes = "1.11.1"
http = { version = "1.4.2", optional = true }

[lints.rust]
# The SDK is unsafe-free; enforce that invariant at compile time (and make it
# self-documenting) rather than relying on review alone.
unsafe_code = "deny"

[lints.clippy]
# Mirror the CI gate (`cargo clippy --all-features --all-targets -- -D warnings`)
# locally: the same correctness/style lints fire AND fail the build in IDEs and
# plain `cargo clippy`, so a regression can't pass locally and only surface in
# CI. NOTE: `pedantic` is intentionally NOT enabled — the crate is only verified
# clean against the default group, and pedantic would surface dozens of new lints.
all = "deny"

[features]
default = []
# RMCP protocol bridge plus JSON-Schema validation for adapted MCP tools.
rmcp-kits = ["dep:rmcp", "toolkits"]
# Unified user-facing MCP API. It does not pull in the lower-level toolkits
# framework; `rmcp-kits` remains available separately for custom MCP bridges.
mcp = ["dep:rmcp"]
# WebSocket realtime (GLM-Realtime) client. Off by default — most users only
# need the HTTP chat/embeddings surface. Pulls in tokio-tungstenite, the JWT
# crypto stack (hmac/sha2), and `tokio/net`.
realtime = [
    "dep:tokio-tungstenite",
    "dep:hmac",
    "dep:sha2",
    "dep:http",
    "dep:uuid",
    "tokio/net",
]
# Enables JSON-Schema validation in the tool-execution framework.
toolkits = ["dep:jsonschema"]

[[example]]
name = "realtime_audio"
required-features = ["realtime"]

[[example]]
name = "mcp"
required-features = ["mcp"]

[[example]]
name = "mcp_web_search"
required-features = ["mcp"]

[[example]]
name = "mcp_web_reader"
required-features = ["mcp"]

[[example]]
name = "mcp_zread"
required-features = ["mcp"]

[[example]]
name = "mcp_vision"
required-features = ["mcp"]

[dev-dependencies]
hyper = { version = "1.10.1", features = ["full"] }
hyper-util = { version = "0.1.20", features = ["full"] }
http-body-util = "0.1.3"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
# Tests generate isolated PNG/WAV/text fixtures instead of relying on repository
# media files.
tempfile = "3.27.0"
# Dev-only networking supports the loopback test server; `test-util` enables
# deterministic paused-time tests for backoff and deadlines.
tokio = { version = "1.52.3", features = ["macros", "net", "rt-multi-thread", "test-util"] }
# Property-based tests exercise protocol and transport invariants.
proptest = "1.11.0"
# The scripted mock WebSocket server under tests/support drives
# tokio-tungstenite directly. It is unconditional because tests/support is
# compiled into every integration-test binary; `handshake` covers the
# server-side accept while TLS and the client `connect` feature stay off.
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
