# spec/contracts/coverage.toml
#
# Contract coverage matrix (plan P00.8 / P06.6).
#
# Lists the 59 frozen OpenAPI operations, the Coding Plan monitor operation and
# the five Realtime protocol paths. Each entry fixes the Rust service method,
# the request/response types and the contract test name (per plan section 14).
# `status` is "missing" until the operation is implemented and exercised by a
# real transport test; P06 flips all 59 OpenAPI operations to "covered".
# Coding Plan and Realtime rows are tracked separately and do not count toward
# the 59-operation denominator.

# Coverage scope:
#   - openapi: 59 operations across 53 paths (includes 3 Agent v1 operations)
#   - coding_plan: 1 monitor operation (GET /monitor/usage/quota/limit)
#   - realtime: 5 protocol paths

