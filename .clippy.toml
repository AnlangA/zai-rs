# Clippy configuration for zai-rs

# Maximum function complexity threshold
cognitive-complexity-threshold = 30

# Maximum type complexity threshold
type-complexity-threshold = 250

# Keep public functions focused without penalizing unavoidable protocol fields.
too-many-arguments-threshold = 7

# Test assertions intentionally use `unwrap`/`expect` for concise failures.
allow-expect-in-tests = true
allow-unwrap-in-tests = true
allow-print-in-tests = true

# Keep wildcard imports explicit outside prelude-oriented examples.
warn-on-all-wildcard-imports = true

# Performance
vec-box-size-threshold = 4096

# Single-char binding names threshold
single-char-binding-names-threshold = 4
