[package]
name = "zai-rs-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
libfuzzer-sys = "0.4"
zai-rs = { path = "..", features = ["toolkits", "realtime"] }

[[bin]]
name = "fuzz_error_envelope"
path = "fuzz_targets/fuzz_error_envelope.rs"

[[bin]]
name = "fuzz_sse_decoder"
path = "fuzz_targets/fuzz_sse_decoder.rs"

[[bin]]
name = "fuzz_url_segments"
path = "fuzz_targets/fuzz_url_segments.rs"

[[bin]]
name = "fuzz_tool_canonical_json"
path = "fuzz_targets/fuzz_tool_canonical_json.rs"
